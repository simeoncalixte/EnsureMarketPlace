<title>ERD</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --border: #e3e8ef; --text: #0f172a;
    --muted: #64748b; --accent: #2563eb; --hover: #f1f5f9; --active: #e0eaff;
    --c-table: #b45309;  --b-table: #fef3c7;
    --c-domain: #475569; --b-domain: #e8edf3;
    --c-pk: #b45309;     --b-pk: #fef3c7;
    --c-fk: #2563eb;     --b-fk: #dbeafe;
    --c-uniq: #7c3aed;   --b-uniq: #ede9fe;
    --wire-ref: #d97706; --wire-opt: #cbd5e1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

  .topbar {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo { width: 26px; height: 26px; color: var(--accent); flex: none; }
  .brand h1 { font-size: 14px; margin: 0; white-space: nowrap; }
  .brand .meta { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  #search {
    margin-left: auto; width: 340px; max-width: 45vw; padding: 7px 12px;
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
    background: var(--bg); outline: none;
  }
  #search:focus { border-color: var(--accent); background: var(--panel); }

  .layout { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px;
  }
  main { flex: 1; min-width: 0; position: relative; overflow: hidden; }

  /* ---- sidebar tree ---- */
  details.tnode { margin: 0; }
  details.tnode > summary {
    display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;
    cursor: pointer; list-style: none; user-select: none; color: var(--text);
  }
  details.tnode > summary::-webkit-details-marker { display: none; }
  details.tnode > summary::before {
    content: ''; width: 0; height: 0; flex: none;
    border-left: 4px solid var(--muted); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent;
    transition: transform .12s ease;
  }
  details.tnode[open] > summary::before { transform: rotate(90deg); }
  details.tnode > summary:hover { background: var(--hover); }
  details.tnode > .tkids { padding-left: 14px; }
  .tcount { margin-left: auto; color: var(--muted); font-size: 10.5px; }
  .leaf {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 6px 4px 16px;
    border: 0; border-radius: 6px; background: none; font: inherit; color: var(--text);
    cursor: pointer; text-align: left;
  }
  .leaf:hover { background: var(--hover); }
  .leaf.active { background: var(--active); color: var(--accent); }
  .leaf .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

  /* ---- icons ---- */
  .ic { width: 17px; height: 17px; flex: none; display: inline-flex; }
  .ic svg { width: 100%; height: 100%; }
  .ic.big { width: 30px; height: 30px; }
  .ic.table { color: var(--c-table); }
  .ic.domain { color: var(--c-domain); }

  /* ---- search results ---- */
  .shead { padding: 8px 6px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }

  /* ---- overview ---- */
  .overview { height: 100%; overflow-y: auto; padding: 24px; }
  .ovgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; align-items: center; gap: 12px;
  }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { color: var(--muted); font-size: 11.5px; }
  .cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .domchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .domchip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); cursor: pointer; font: inherit; color: var(--text);
  }
  .domchip:hover { border-color: var(--accent); }
  .domchip .n { color: var(--muted); font-size: 11px; }

  /* ---- table cards (shared by lists + detail columns) ---- */
  .ncard {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    font: inherit; color: var(--text); cursor: pointer; text-align: left;
  }
  .ncard:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(37,99,235,.12); }
  .ntext { min-width: 0; flex: 1; }
  .nname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .nsub { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .chips { display: flex; gap: 4px; flex: none; max-width: 50%; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap;
    background: var(--b-fk); color: var(--c-fk);
  }
  .chip.card { background: var(--b-domain); color: var(--c-domain); font-family: ui-monospace, Menlo, monospace; }

  /* ---- detail / focus view ---- */
  .detail { display: grid; grid-template-columns: 1fr 360px 1fr; gap: 36px; height: 100%; padding: 20px; position: relative; }
  svg.wires { position: absolute; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%; }
  .col { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; z-index: 1; padding: 2px; }
  .colhead { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 2px 2px 4px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 2px; }
  .focus-wrap { display: flex; flex-direction: column; justify-content: center; z-index: 1; min-width: 0; }
  .focus-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 4px 18px rgba(15,23,42,.08); overflow: hidden; max-height: 100%;
    display: flex; flex-direction: column;
  }
  .fhead { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .fname { font-size: 16px; font-weight: 700; word-break: break-word; }
  .fmeta { color: var(--muted); margin-top: 2px; }
  .kindchip { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: var(--b-domain); color: var(--c-domain); }
  .fdesc { padding: 12px 18px; color: var(--text); background: var(--bg); border-bottom: 1px solid var(--border); font-size: 12.5px; line-height: 1.5; }
  .cols-list { overflow-y: auto; }
  .crow { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--hover); }
  .crow:last-child { border-bottom: 0; }
  .crow.fk { cursor: pointer; }
  .crow.fk:hover { background: var(--hover); }
  .ckey { width: 15px; flex: none; text-align: center; }
  .cname { font-weight: 600; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .ctype { color: var(--muted); margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: nowrap; }

  .fcounts { display: flex; gap: 16px; color: var(--muted); font-size: 12px; padding: 10px 18px; border-top: 1px solid var(--border); }
  .fcounts b { color: var(--text); }
  .reltag { font-size: 10px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
</style>

        chips: [{ text: rel.cardinality, card: true }],
      });
      card.dataset.optional = rel.optional ? '1' : '0';
      col.appendChild(card);
    }
    return col;
  }

  function focusCard(table) {
    const wrap = el('div', 'focus-wrap');
    const card = el('div', 'focus-card');

    const head = el('div', 'fhead');
    const ic = el('span'); ic.innerHTML = icon('table', true); head.appendChild(ic.firstChild);
    const headText = el('div'); headText.style.minWidth = '0';
    headText.appendChild(el('div', 'fname', table.name));
    headText.appendChild(el('div', 'fmeta mono', table.tableName));
    headText.appendChild(el('span', 'kindchip', table.domain));
    head.appendChild(headText);
    card.appendChild(head);

    if (table.description) card.appendChild(el('div', 'fdesc', table.description));

    const list = el('div', 'cols-list');
    for (const c of table.columns) {
      const isFk = !!c.references;
      const row = el('div', 'crow' + (isFk ? ' fk' : ''));
      const key = el('span', 'ckey');
      if (c.primaryKey) { key.innerHTML = icon('key'); key.querySelector('.ic').style.color = 'var(--c-pk)'; }
      else if (isFk) { key.innerHTML = icon('link'); key.querySelector('.ic').style.color = 'var(--c-fk)'; }
      row.appendChild(key);
      row.appendChild(el('span', 'cname', c.name));
      if (c.primaryKey) row.appendChild(el('span', 'cbadge pk', 'PK'));
      if (isFk) row.appendChild(el('span', 'cbadge fk', 'FK'));
      if (c.unique && !c.primaryKey) row.appendChild(el('span', 'cbadge uq', 'UQ'));
      if (c.allowNull) row.appendChild(el('span', 'cbadge nl', 'NULL'));
      row.appendChild(el('span', 'ctype', c.type));
      if (isFk) {
        row.title = '→ ' + c.references.table + '.' + c.references.column;
        row.addEventListener('click', () => selectTable(c.references.table));
      }
      list.appendChild(row);
    }
    card.appendChild(list);

    const parents = refsOut.get(table.name) ?? [];
    const children = refsIn.get(table.name) ?? [];
    const counts = el('div', 'fcounts');
    const left = el('span'); left.innerHTML = '← <b>' + fmt(parents.length) + '</b> references';
    const right = el('span'); right.innerHTML = '<b>' + fmt(children.length) + '</b> referenced by →';
    const mid = el('span'); mid.innerHTML = '<b>' + fmt(table.columns.length) + '</b> columns';
    counts.appendChild(left); counts.appendChild(mid); counts.appendChild(right);
    card.appendChild(counts);

    wrap.appendChild(card);
    return wrap;
  }

  function renderDetail(table) {
    main.replaceChildren();
    const view = el('div', 'detail');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'wires');
    view.appendChild(svg);

    const sortRels = (list, otherKey) => list.slice().sort((a, b) => a[otherKey].localeCompare(b[otherKey]));
    const parents = sortRels(refsOut.get(table.name) ?? [], 'parent');
    const children = sortRels(refsIn.get(table.name) ?? [], 'child');

    view.appendChild(relColumn('parents', 'References', parents, 'parent'));
    view.appendChild(focusCard(table));
    view.appendChild(relColumn('children', 'Referenced by', children, 'child'));
    main.appendChild(view);

    for (const col of view.querySelectorAll('.col')) col.addEventListener('scroll', () => scheduleWires(view), { passive: true });
    const cardsList = view.querySelector('.cols-list');
    if (cardsList) cardsList.addEventListener('scroll', () => scheduleWires(view), { passive: true });
    scheduleWires(view);
  }

  window.addEventListener('resize', () => {
    const view = main.querySelector('.detail');
    if (view) scheduleWires(view);
  });

  // ---------- routing ----------
  function render() {
    const table = tablesByName.get(currentName());
    if (table) renderDetail(table);
    else renderOverview();
    markActive();
  }
  window.addEventListener('hashchange', render);

  renderTree();
  render();
})();
</script>
</body>
</html>
