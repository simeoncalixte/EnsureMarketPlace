<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Call Graph</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --border: #e3e8ef; --text: #0f172a;
    --muted: #64748b; --accent: #2563eb; --hover: #f1f5f9; --active: #e0eaff;
    --c-function: #2563eb; --b-function: #dbeafe;
    --c-method: #7c3aed;   --b-method: #ede9fe;
    --c-entity: #b45309;   --b-entity: #fef3c7;
    --c-route: #047857;    --b-route: #d1fae5;
    --c-class: #c2410c;    --b-class: #ffedd5;
    --c-module: #475569;   --b-module: #e8edf3;
    --wire-calls: #94a3b8; --wire-uses: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

  .topbar {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo { width: 26px; height: 26px; color: var(--accent); flex: none; }
  .brand h1 { font-size: 14px; margin: 0; white-space: nowrap; }
  .brand .meta { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  #search {
    margin-left: auto; width: 340px; max-width: 45vw; padding: 7px 12px;
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
    background: var(--bg); outline: none;
  }
  #search:focus { border-color: var(--accent); background: var(--panel); }

  .layout { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px;
  }
  main { flex: 1; min-width: 0; position: relative; overflow: hidden; }

  /* ---- sidebar tree ---- */
  details.tnode { margin: 0; }
  details.tnode > summary {
    display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px;
    cursor: pointer; list-style: none; user-select: none; color: var(--text);
  }
  details.tnode > summary::-webkit-details-marker { display: none; }
  details.tnode > summary::before {
    content: ''; width: 0; height: 0; flex: none;
    border-left: 4px solid var(--muted); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent;
    transition: transform .12s ease;
  }
  details.tnode[open] > summary::before { transform: rotate(90deg); }
  details.tnode > summary:hover { background: var(--hover); }
  details.tnode > .tkids { padding-left: 14px; }
  .tcount { margin-left: auto; color: var(--muted); font-size: 10.5px; }
  .leaf {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 6px 3px 16px;
    border: 0; border-radius: 6px; background: none; font: inherit; color: var(--text);
    cursor: pointer; text-align: left;
  }
  .leaf:hover { background: var(--hover); }
  .leaf.active { background: var(--active); color: var(--accent); }
  .leaf .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- icons ---- */
  .ic { width: 17px; height: 17px; flex: none; display: inline-flex; }
  .ic svg { width: 100%; height: 100%; }
  .ic.big { width: 30px; height: 30px; }
  .ic.function { color: var(--c-function); } .ic.method { color: var(--c-method); }
  .ic.entity { color: var(--c-entity); }     .ic.route { color: var(--c-route); }
  .ic.class { color: var(--c-class); }       .ic.module { color: var(--c-module); }
  .ic.folder { color: #94a3b8; }

  /* ---- search results ---- */
  .shead { padding: 8px 6px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }

  /* ---- overview ---- */
  .overview { height: 100%; overflow-y: auto; padding: 24px; }
  .ovgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; align-items: center; gap: 12px;
  }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { color: var(--muted); font-size: 11.5px; }
  .cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; align-items: center; }
  .legend .item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .legend .wire { width: 26px; height: 2px; border-radius: 2px; }

  /* ---- node cards (shared by lists + detail columns) ---- */
  .ncard {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    font: inherit; color: var(--text); cursor: pointer; text-align: left;
  }
  .ncard:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(37,99,235,.12); }
  .ntext { min-width: 0; flex: 1; }
  .nname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .nsub { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .chips { display: flex; gap: 4px; flex: none; max-width: 45%; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
    background: var(--b-entity); color: var(--c-entity); white-space: nowrap;
  }

  /* ---- detail / focus view ---- */
  .detail { display: grid; grid-template-columns: 1fr 330px 1fr; gap: 36px; height: 100%; padding: 20px; position: relative; }
  svg.wires { position: absolute; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%; }
  .col { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; z-index: 1; padding: 2px; }
  .colhead { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 2px 2px 4px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 2px; }
  .focus-wrap { display: flex; flex-direction: column; justify-content: center; gap: 12px; z-index: 1; min-width: 0; }
  .focus-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; box-shadow: 0 4px 18px rgba(15,23,42,.08);
  }
  .fhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .fname { font-size: 16px; font-weight: 700; word-break: break-word; }
  .kindchip { display: inline-block; margin-top: 2px; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
  .fmeta { color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .fcounts { display: flex; gap: 16px; color: var(--muted); font-size: 12px; }
  .fcounts b { color: var(--text); }
</style>
</head>

  function neighborColumn(cls, heading, entries) {
    const col = el('div', 'col ' + cls);
    col.appendChild(el('div', 'colhead', heading + ' (' + fmt(entries.length) + ')'));
    if (!entries.length) col.appendChild(el('div', 'empty', 'none'));
    for (const { node, edge } of entries) {
      const card = nodeCard(node, edge.kind === 'uses' ? edge.labels : null);
      card.dataset.edgeKind = edge.kind;
      col.appendChild(card);
    }
    return col;
  }

  function renderDetail(node) {
    main.replaceChildren();
    const view = el('div', 'detail');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'wires');
    view.appendChild(svg);

    const sortEntries = (list) => list.sort((a, b) => a.node.file.localeCompare(b.node.file) || a.node.name.localeCompare(b.node.name));
    const callers = sortEntries((inEdges.get(node.id) ?? []).map((edge) => ({ edge, node: nodesById.get(edge.from) })));
    const callees = sortEntries((outEdges.get(node.id) ?? []).map((edge) => ({ edge, node: nodesById.get(edge.to) })));
    const isEntity = node.kind === 'entity';

    view.appendChild(neighborColumn('callers', isEntity ? 'Used by' : 'Callers', callers));

    const focusWrap = el('div', 'focus-wrap');
    const card = el('div', 'focus-card');
    const head = el('div', 'fhead');
    const ic = el('span'); ic.innerHTML = icon(node.kind, true); head.appendChild(ic.firstChild);
    const headText = el('div');
    headText.appendChild(el('div', 'fname', node.name));
    const chip = el('span', 'kindchip', KIND[node.kind].label);
    chip.style.background = KIND[node.kind].bg;
    chip.style.color = KIND[node.kind].color;
    headText.appendChild(chip);
    head.appendChild(headText);
    card.appendChild(head);
    card.appendChild(el('div', 'fmeta mono', node.file + ':' + node.line));
    const counts = el('div', 'fcounts');
    const left = el('span'); left.innerHTML = '← <b>' + fmt(callers.length) + '</b> ' + (isEntity ? 'used by' : 'callers');
    const right = el('span'); right.innerHTML = '<b>' + fmt(callees.length) + '</b> callees →';
    counts.appendChild(left); counts.appendChild(right);
    card.appendChild(counts);
    focusWrap.appendChild(card);
    view.appendChild(focusWrap);

    view.appendChild(neighborColumn('callees', 'Callees', callees));
    main.appendChild(view);

    for (const col of view.querySelectorAll('.col')) col.addEventListener('scroll', () => scheduleWires(view), { passive: true });
    scheduleWires(view);
  }

  window.addEventListener('resize', () => {
    const view = main.querySelector('.detail');
    if (view) scheduleWires(view);
  });

  // ---------- routing ----------
  function render() {
    const node = nodesById.get(currentId());
    if (node) renderDetail(node);
    else renderOverview();
    markActive();
  }
  window.addEventListener('hashchange', render);

  renderTree();
  render();
})();
</script>
</body>
</html>
