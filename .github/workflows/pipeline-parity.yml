name: Application package verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  release-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Read-only access to the private submodule repos and package registry.
          token: ${{ secrets.ENSURED_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: https://npm.pkg.github.com
          scope: '@simeoncalixte'
      - name: Install locked release dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ENSURED_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.ENSURED_READ_TOKEN }}
        run: |
          npm ci --ignore-scripts
          npm --prefix EnsuredAPI ci --ignore-scripts
          npm --prefix EnsuredUI ci --ignore-scripts
          npm --prefix EnsuredNetwork/frontend ci --ignore-scripts
      - run: npm run packages:check -- --installed EnsuredAPI EnsuredUI
      - run: npm run workspace:check
      - run: npm run pipeline:test-gate
      - name: Verify installed artifacts against locked registry archives
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ENSURED_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.ENSURED_READ_TOKEN }}
        run: |
          set -o pipefail
          npm run pipeline:verify 2>&1 | tee pipeline-parity-evidence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-parity-evidence
          path: pipeline-parity-evidence.log
