name: Pipeline release parity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  release-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Read-only access to the private submodule repos and package registry.
          token: ${{ secrets.ENSURED_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: https://npm.pkg.github.com
          scope: '@simeoncalixte'
      - name: Install locked release dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ENSURED_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.ENSURED_READ_TOKEN }}
        run: |
          npm ci --ignore-scripts
          npm --prefix EnsuredAPI ci --ignore-scripts
          npm --prefix EnsuredPipelineShared ci --ignore-scripts
          npm --prefix EnsuredConstants ci --ignore-scripts
          # These two libraries have no lockfiles. Compile against the exact
          # API release dependency graph, not a fresh floating npm install.
          ln -s ../EnsuredAPI/node_modules EnsuredPipelineCapacity/node_modules
          ln -s ../EnsuredAPI/node_modules EnsuredPipelineRiskCompute/node_modules
          npm --prefix EnsuredConstants run build
      - run: npm run pipeline:test-gate
      - name: Verify source ownership and actual financial artifacts
        run: |
          set -o pipefail
          npm run pipeline:verify 2>&1 | tee pipeline-parity-evidence.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-parity-evidence
          path: pipeline-parity-evidence.log
