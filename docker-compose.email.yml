services:
  email:
    build: ./EnsuredEmail
    env_file: ./EnsuredAPI/.env
    environment:
      EMAIL_HOST: 0.0.0.0
    ports: ['127.0.0.1:3013:3013']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3013/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  default:
    name: ensured-platform
    external: true
