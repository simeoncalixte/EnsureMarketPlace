services:
  email:
    build: ./EnsuredEmail
    environment:
      EMAIL_HOST: 0.0.0.0
      EMAIL_SERVICE_SECRET: ${EMAIL_SERVICE_SECRET:?Set the same EMAIL_SERVICE_SECRET as EnsuredAPI}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT: ${MS_TENANT:-common}
    ports: ['127.0.0.1:3013:3013']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3013/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  default:
    name: ensured-platform
    external: true
