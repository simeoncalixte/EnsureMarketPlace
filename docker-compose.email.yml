# Development: docker compose -f docker-compose.email.yml up --build --watch
# Keep Watch running to apply source changes; dependency changes rebuild the affected image.
services:
  email:
    build: ./EnsuredEmail
    env_file: ./EnsuredAPI/.env
    environment:
      EMAIL_HOST: 0.0.0.0
    ports: ['127.0.0.1:3013:3013']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3013/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    develop:
      watch:
        - action: rebuild
          path: ./EnsuredEmail
          ignore: [node_modules/, .git/, dist/, .env, .env.*]

networks:
  default:
    name: ensured-platform
    external: true
