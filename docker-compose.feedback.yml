# Development: docker compose -f docker-compose.feedback.yml up --build --watch
# Keep Watch running to apply source changes; dependency changes rebuild the affected image.
services:
  submission-feedback:
    build: ./EnsuredSubmissionFeedback
    container_name: ensured-submission-feedback
    environment:
      SUBMISSION_FEEDBACK_TOKEN: ${SUBMISSION_FEEDBACK_TOKEN:?Set SUBMISSION_FEEDBACK_TOKEN}
      FEEDBACK_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ensured_marketplace
      PORT: 3014
    ports: ['127.0.0.1:3014:3014']
    restart: unless-stopped
    networks: [platform]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3014/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    develop:
      watch:
        - action: sync+restart
          path: ./EnsuredSubmissionFeedback
          target: /app
          initial_sync: true
          ignore: [node_modules/, .git/, dist/, .env, .env.*, package.json, package-lock.json, Dockerfile]
        - action: rebuild
          path: ./EnsuredSubmissionFeedback/package.json
        - action: rebuild
          path: ./EnsuredSubmissionFeedback/package-lock.json
        - action: rebuild
          path: ./EnsuredSubmissionFeedback/Dockerfile

networks:
  platform:
    external: true
    name: ensured-platform
