# Disposable integration database. Does not share the development database,
# external platform network, fixed container names, or persistent volumes.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ensured_finance_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FINANCE_TEST_PASSWORD:?Set by scripts/test-finance-docker.mjs}
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ensured_finance_test"]
      interval: 1s
      timeout: 3s
      retries: 30
