# Development: docker compose -f docker-compose.services.yml up --build --watch
# Keep Watch running to apply source changes; dependency changes rebuild the affected image.
# Applications use the shared PostgreSQL service on ensured-platform.
services:
  auth:
    build:
      context: ./EnsuredAuth
      secrets: [node_auth_token]
    container_name: ensured-auth
    env_file: ./EnsuredAPI/.env
    environment:
      SERVICES_AUTH_URL: http://auth:3003
      SERVICES_REGISTRY_URL: http://catalog:3010
      SERVICES_INSTANCE_ID: auth-local
      AUTH_DEV_UI_ORIGIN: http://localhost:3000
      AUTH_BIND_HOST: 0.0.0.0
      AUTH_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ensured_identity
      MARKETPLACE_API_URL: http://api:3001
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    command: ['sh', '-c', 'npm run migrate && npm start']
    ports: ['127.0.0.1:3003:3003']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    develop:
      watch:
        - action: sync+restart
          path: ./EnsuredAuth
          target: /app
          initial_sync: true
          ignore: [node_modules/, .git/, dist/, .env, .env.*, package.json, package-lock.json, Dockerfile]
        - action: rebuild
          path: ./EnsuredAuth/package.json
        - action: rebuild
          path: ./EnsuredAuth/package-lock.json
        - action: rebuild
          path: ./EnsuredAuth/Dockerfile

  kyc:
    build: ./EnsuredKYC
    container_name: ensured-kyc
    env_file: ./EnsuredAPI/.env
    environment:
      KYC_BIND_HOST: 0.0.0.0
      KYC_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ensured_kyc
    command: ['sh', '-c', 'npm run migrate && npm start']
    ports: ['127.0.0.1:3004:3004']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    develop:
      watch:
        - action: sync+restart
          path: ./EnsuredKYC
          target: /app
          initial_sync: true
          ignore: [node_modules/, .git/, dist/, .env, .env.*, package.json, package-lock.json, Dockerfile]
        - action: rebuild
          path: ./EnsuredKYC/package.json
        - action: rebuild
          path: ./EnsuredKYC/package-lock.json
        - action: rebuild
          path: ./EnsuredKYC/Dockerfile

  gateway:
    build:
      context: ./EnsuredAuth
      secrets: [node_auth_token]
    container_name: ensured-gateway
    env_file: ./EnsuredAPI/.env
    environment:
      AUTH_DEV_UI_ORIGIN: http://localhost:3000
      AUTH_BIND_HOST: 0.0.0.0
      AUTH_INTERNAL_URL: http://auth:3003
      KYC_INTERNAL_URL: http://kyc:3004
      MARKETPLACE_API_URL: http://api:3001
      MARKETPLACE_UI_URL: http://frontend.localhost:3000
      SERVICES_REGISTRY_URL: ''
    command: ['npm', 'run', 'start:gateway']
    ports: ['127.0.0.1:3002:3002']
    restart: unless-stopped
    depends_on:
      auth: { condition: service_healthy }
      kyc: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    develop:
      watch:
        - action: sync+restart
          path: ./EnsuredAuth
          target: /app
          initial_sync: true
          ignore: [node_modules/, .git/, dist/, .env, .env.*, package.json, package-lock.json, Dockerfile]
        - action: rebuild
          path: ./EnsuredAuth/package.json
        - action: rebuild
          path: ./EnsuredAuth/package-lock.json
        - action: rebuild
          path: ./EnsuredAuth/Dockerfile

  catalog:
    build: ./EnsuredServices
    container_name: ensured-services
    env_file: ./EnsuredAPI/.env
    environment:
      SERVICES_HOST: 0.0.0.0
      SERVICES_READ_TOKEN: ${DOCKER_SERVICES_READ_TOKEN:?Run scripts/start-docker-services.mjs}
      SERVICES_PROVIDER: local
      SERVICES_CATALOG_FILE: /app/catalog.docker.json
    volumes: ['./EnsuredServices/catalog.docker.json:/app/catalog.docker.json:ro']
    ports: ['127.0.0.1:3010:3010']
    restart: unless-stopped
    develop:
      watch:
        - action: restart
          path: ./EnsuredServices/catalog.docker.json
        - action: sync+restart
          path: ./EnsuredServices
          target: /app
          initial_sync: true
          ignore: [node_modules/, .git/, dist/, .env, .env.*, package.json, package-lock.json, Dockerfile, catalog.docker.json]
        - action: rebuild
          path: ./EnsuredServices/package.json
        - action: rebuild
          path: ./EnsuredServices/package-lock.json
        - action: rebuild
          path: ./EnsuredServices/Dockerfile

  submission-ui:
    build: ./SubmissionUI
    container_name: ensured-submission-ui
    command: ['npm', 'run', 'frontend']
    ports: ['127.0.0.1:30025:30025']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:30025/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    develop:
      watch:
        - action: sync
          path: ./SubmissionUI
          target: /app
          initial_sync: true
          ignore: [node_modules/, .git/, dist/, .env, .env.*, package.json, package-lock.json, Dockerfile]
        - action: rebuild
          path: ./SubmissionUI/package.json
        - action: rebuild
          path: ./SubmissionUI/package-lock.json
        - action: rebuild
          path: ./SubmissionUI/Dockerfile

  submission-relay:
    build: ./SubmissionUI
    container_name: ensured-submission-relay
    env_file: ./EnsuredAPI/.env
    command: ['npm', 'run', 'relay']
    environment:
      RABBIT_URL: amqp://rabbitmq
    ports: ['127.0.0.1:30026:30026']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:30026/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    develop:
      watch:
        - action: sync+restart
          path: ./SubmissionUI
          target: /app
          initial_sync: true
          ignore: [node_modules/, .git/, dist/, .env, .env.*, package.json, package-lock.json, Dockerfile]
        - action: rebuild
          path: ./SubmissionUI/package.json
        - action: rebuild
          path: ./SubmissionUI/package-lock.json
        - action: rebuild
          path: ./SubmissionUI/Dockerfile

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

networks:
  default:
    name: ensured-platform
    external: true
